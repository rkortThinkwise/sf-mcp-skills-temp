<!--
Theme-aware inline Thinkwise logo mark for use inside a published Artifact.
Paste this <svg>...</svg> block directly into the artifact HTML (do not
reference it as an external file — Artifacts must be self-contained).

The four brand fills are CSS custom properties so the mark stays legible in
both themes. Define them once in the page's :root token block, e.g.:

  :root {
    --logo-ink: #0A0907;
    --logo-blue-1: #1D71B8;
    --logo-blue-2: #38A8E0;
    --logo-blue-3: #1C52A1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --logo-ink: #F5F3F0;
      --logo-blue-1: #4A9FD8;
      --logo-blue-3: #2E6BB8;
    }
  }
  :root[data-theme="dark"] {
    --logo-ink: #F5F3F0;
    --logo-blue-1: #4A9FD8;
    --logo-blue-3: #2E6BB8;
  }

(--logo-blue-2 / #38A8E0 is already bright enough to keep as-is in dark mode.)
-->
<svg class="tw-logo" viewBox="0 0 450 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thinkwise">
<style>
	.tw-logo .st0{fill:var(--logo-ink);}
	.tw-logo .st1{fill:var(--logo-blue-1);}
	.tw-logo .st2{fill:var(--logo-blue-2);}
	.tw-logo .st3{fill:var(--logo-blue-3);}
</style>
